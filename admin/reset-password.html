<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0A0A0A" />
  <title>Reset Password — Baari Sports Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body">

  <div class="admin-login-screen" id="resetScreen">
    <form class="admin-login-card" id="resetPasswordForm">
      <div class="admin-login-logo">
        <span class="logo-main">BAARI</span>
        <span class="logo-sub">Set New Password</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="newPassword">New Password</label>
        <div class="password-field">
          <input class="form-input" type="password" id="newPassword" autocomplete="new-password" minlength="6" required />
          <button class="password-toggle-btn" type="button" id="newPasswordToggle" aria-label="Show password" aria-pressed="false">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" hidden>
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.6 20.6 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 7 11 7a20.6 20.6 0 0 1-2.61 3.53M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm New Password</label>
        <div class="password-field">
          <input class="form-input" type="password" id="confirmPassword" autocomplete="new-password" minlength="6" required />
          <button class="password-toggle-btn" type="button" id="confirmPasswordToggle" aria-label="Show password" aria-pressed="false">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" hidden>
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.6 20.6 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 7 11 7a20.6 20.6 0 0 1-2.61 3.53M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <button class="btn btn--primary btn--full" type="submit" id="resetSubmitBtn">
        <span class="btn-label">Set New Password</span>
        <span class="btn-spinner" hidden></span>
      </button>
      <p class="admin-login-error" id="resetError"></p>
      <p class="admin-login-success" id="resetSuccess"></p>
      <a href="admin.html" class="admin-login-back">← Back to Sign In</a>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/config.js"></script>
  <script>
    'use strict';

    const { URL: SUPABASE_URL, ANON_KEY: SUPABASE_ANON_KEY } = BAARI_CONFIG.SUPABASE;
    const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    const $ = (id) => document.getElementById(id);

    function bindPasswordToggle(inputId, btnId) {
      const input = $(inputId);
      const btn = $(btnId);
      if (!input || !btn) return;
      const eyeIcon = btn.querySelector('.icon-eye');
      const eyeOffIcon = btn.querySelector('.icon-eye-off');
      btn.addEventListener('click', () => {
        const isVisible = input.type === 'text';
        input.type = isVisible ? 'password' : 'text';
        btn.setAttribute('aria-pressed', String(!isVisible));
        btn.setAttribute('aria-label', isVisible ? 'Show password' : 'Hide password');
        eyeIcon.hidden = !isVisible;
        eyeOffIcon.hidden = isVisible;
      });
    }
    bindPasswordToggle('newPassword', 'newPasswordToggle');
    bindPasswordToggle('confirmPassword', 'confirmPasswordToggle');

    function setBtnLoading(btn, isLoading, idleLabel) {
      const label = btn.querySelector('.btn-label');
      const spinner = btn.querySelector('.btn-spinner');
      btn.disabled = isLoading;
      if (label && idleLabel) label.textContent = isLoading ? 'Saving…' : idleLabel;
      if (spinner) spinner.hidden = !isLoading;
    }

    // Supabase's password-recovery link signs the visitor into a
    // temporary "recovery" session automatically (via the URL hash
    // fragment) — we don't need to parse tokens manually, just listen
    // for the event and then allow the password update.
    let recoveryReady = false;
    db?.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') {
        recoveryReady = true;
      }
    });

    $('resetPasswordForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = $('resetError');
      const successEl = $('resetSuccess');
      errEl.textContent = '';
      successEl.textContent = '';

      const newPassword = $('newPassword').value;
      const confirmPassword = $('confirmPassword').value;

      if (newPassword.length < 6) {
        errEl.textContent = 'Password must be at least 6 characters.';
        return;
      }
      if (newPassword !== confirmPassword) {
        errEl.textContent = 'Passwords do not match.';
        return;
      }

      const btn = $('resetSubmitBtn');
      setBtnLoading(btn, true);

      const { error } = await db.auth.updateUser({ password: newPassword });

      setBtnLoading(btn, false, 'Set New Password');

      if (error) {
        errEl.textContent = error.message || 'Failed to reset password. The link may have expired — request a new one.';
        return;
      }

      successEl.textContent = 'Password updated! Redirecting to sign in…';
      $('resetPasswordForm').reset();
      setTimeout(() => { window.location.href = 'admin.html'; }, 2000);
    });
  </script>
</body>
</html>
